<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RF Toolbox</title>
<meta name="description" content="RF engineering calculators: link budget, cascade NF/IP3, dish gain, VSWR, coax loss, noise, propagation, pads, microstrip. Works offline.">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RF Toolbox">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button id="backBtn" class="hb" aria-label="Back to tools" hidden>‹</button>
  <h1 id="title">RF Toolbox</h1>
  <button id="themeBtn" class="hb" aria-label="Theme">🌓</button>
</header>
<div id="update-bar" class="update" hidden>A new version is ready. <button id="update-btn" class="btn sm primary">Update</button></div>
<main id="app"><noscript>RF Toolbox needs JavaScript.</noscript></main>
<div id="install-banner" class="install" hidden>
  <img src="icons/icon-192.png" alt="" width="40" height="40">
  <div class="it"><b>Install RF Toolbox</b><span id="install-sub"></span></div>
  <button id="install-btn" class="btn primary sm">Install</button>
  <button id="install-dismiss" class="hb sm" aria-label="Dismiss">✕</button>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="js/rf.js"></script>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
